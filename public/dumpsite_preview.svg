<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Warm Grid/Aesthetic Technical Background -->
  <rect width="1200" height="630" fill="#f8fafc" />
  
  <!-- Subtle Grid Overlay -->
  <path d="M0,0 L1200,0 M0,50 L1200,50 M0,100 L1200,100 M0,150 L1200,150 M0,200 L1200,200 M0,250 L1200,250 M0,300 L1200,300 M0,350 L1200,350 M0,400 L1200,400 M0,450 L1200,450 M0,500 L1200,500 M0,550 L1200,550 M0,600 L1200,600" stroke="#e2e8f0" stroke-width="0.5" stroke-dasharray="2,5" />
  <path d="M0,0 L0,630 M50,0 L50,630 M100,0 L100,630 M150,0 L150,630 M200,0 L200,630 M250,0 L250,630 M300,0 L300,630 M350,0 L350,630 M400,0 L400,630 M450,0 L450,630 M500,0 L500,630 M550,0 L550,630 M600,0 L600,630 M650,0 L650,630 M700,0 L700,630 M750,0 L750,630 M800,0 L800,630 M850,0 L850,630 M900,0 L900,630 M950,0 L950,630 M1000,0 L1000,630 M1050,0 L1050,630 M1100,0 L1100,630 M1150,0 L1150,630" stroke="#e2e8f0" stroke-width="0.5" stroke-dasharray="2,5" />

  <!-- Diagonal isometric perspective lines -->
  <path d="M -200,100 L 1400,900 M -200,200 L 1400,1000 M -200,300 L 1400,1100 M -200,0 L 1400,800 M -200,-100 L 1400,700" stroke="#f1f5f9" stroke-width="1.5" />

  <!-- Right Side Split Layout Card Background -->
  <rect x="700" y="0" width="500" height="630" fill="#ffffff" rx="10" filter="drop-shadow(-15px 0 30px rgba(15, 23, 42, 0.04))" />

  <!-- Left Side Branding Header -->
  <g transform="translate(60, 60)">
    <!-- Logo Badge -->
    <rect width="48" height="48" rx="14" fill="#059669" />
    <text x="24" y="31" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="900" font-size="22" text-anchor="middle">d</text>
    
    <!-- Title -->
    <text x="64" y="24" fill="#0f172a" font-family="'Space Grotesk', 'Inter', sans-serif" font-weight="800" font-size="20" letter-spacing="0.5">dumpsite</text>
    <text x="64" y="40" fill="#64748b" font-family="'Inter', sans-serif" font-weight="700" font-size="11" letter-spacing="0.5">Admin Portal</text>
  </g>

  <!-- Isometric Recycling Depot Illustration (Left Side) -->
  <g transform="translate(180, 160)">
    <!-- Floor Base -->
    <polygon points="150,220 380,120 230,50 0,150" fill="#cbd5e1" opacity="0.4" />
    <polygon points="150,225 380,125 380,120 150,220" fill="#94a3b8" opacity="0.4" />
    <polygon points="150,225 0,155 0,150 150,220" fill="#64748b" opacity="0.4" />

    <!-- Isometric building main block -->
    <g transform="translate(40, -10)">
      <!-- Left side (dim) -->
      <polygon points="0,80 100,130 100,200 0,150" fill="#e2e8f0" />
      <!-- Right side (light) -->
      <polygon points="100,130 220,70 220,140 100,200" fill="#f1f5f9" />
      <!-- Top side (bright white) -->
      <polygon points="0,80 120,20 220,70 100,130" fill="#ffffff" />

      <!-- Isometric portal windows (Emerald slits) -->
      <polygon points="120,115 130,110 130,140 120,145" fill="#059669" />
      <polygon points="140,105 150,100 150,130 140,135" fill="#059669" />
      <polygon points="160,95 170,90 170,120 160,125" fill="#059669" />

      <!-- Secondary attachment block -->
      <g transform="translate(110, 60)">
        <polygon points="0,50 60,80 60,120 0,90" fill="#f1f5f9" />
        <polygon points="60,80 120,50 120,90 60,120" fill="#ffffff" />
        <polygon points="0,50 60,20 120,50 60,80" fill="#ffffff" filter="drop-shadow(0px 5px 5px rgba(0,0,0,0.02))" />
      </g>

      <!-- Entrance gate -->
      <polygon points="20,135 60,155 60,120 20,100" fill="#1e293b" />
      <polygon points="22,132 58,150 58,122 22,104" fill="#0f172a" />
      <polygon points="25,125 55,140 55,138 25,123" fill="#34d399" />
    </g>

    <!-- Additional Detail Badges / Indicators -->
    <g transform="translate(260, 50)">
      <!-- Line to ECO Challenge -->
      <line x1="0" y1="50" x2="30" y2="0" stroke="#059669" stroke-width="1.5" stroke-dasharray="3,3" />
      <circle cx="0" cy="50" r="4" fill="#059669" />
      <!-- ECO Challenge pill -->
      <rect x="20" y="-12" width="100" height="22" rx="4" fill="#0f172a" />
      <text x="70" y="3" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="900" text-anchor="middle" letter-spacing="1">ECO CHALLENGE</text>
    </g>

    <g transform="translate(0, 160)">
      <!-- RECYCLING DEPOT indicator -->
      <line x1="40" y1="10" x2="40" y2="-30" stroke="#059669" stroke-width="1" />
      <rect x="0" y="-45" width="80" height="15" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1" />
      <text x="40" y="-35" fill="#166534" font-family="'Inter', sans-serif" font-size="7" font-weight="900" text-anchor="middle" letter-spacing="0.5">RECYCLING DEPOT</text>
      <!-- Small color blocks -->
      <g transform="translate(20, 20)">
         <!-- Orange -->
         <polygon points="0,5 10,0 20,5 10,10" fill="#f97316" />
      </g>
      <g transform="translate(40, 28)">
         <!-- Blue -->
         <polygon points="0,5 10,0 20,5 10,10" fill="#0ea5e9" />
      </g>
      <g transform="translate(60, 35)">
         <!-- Green -->
         <polygon points="0,5 10,0 20,5 10,10" fill="#10b981" />
      </g>
    </g>
  </g>

  <!-- Left Side Bottom Headline -->
  <g transform="translate(60, 480)">
    <text x="0" y="0" fill="#0f172a" font-family="'Space Grotesk', 'Inter', sans-serif" font-weight="800" font-size="24">Autonomous Waste Cycle Management &amp; Materials Recovery</text>
    <text x="0" y="24" fill="#475569" font-family="'Inter', sans-serif" font-weight="500" font-size="12">Connecting high-speed home dumpers, automated logistic agents, and materials</text>
    <text x="0" y="42" fill="#475569" font-family="'Inter', sans-serif" font-weight="500" font-size="12">recovery recycling factories across Lagos bounds with zero carbon print index.</text>

    <!-- Badges -->
    <g transform="translate(0, 65)">
      <!-- Badge 1 -->
      <rect width="112" height="24" rx="12" fill="#eff6ff" />
      <text x="56" y="15" fill="#1e40af" font-family="'Inter', sans-serif" font-weight="800" font-size="9" text-anchor="middle" letter-spacing="0.5">⚙️ SMART RECOVERY</text>
      
      <!-- Badge 2 -->
      <rect x="122" width="138" height="24" rx="12" fill="#ecfdf5" />
      <text x="191" y="15" fill="#065f46" font-family="'Inter', sans-serif" font-weight="800" font-size="9" text-anchor="middle" letter-spacing="0.5">🌿 LIVE CIRCULAR ECONOMY</text>
    </g>
  </g>

  <!-- Right Side Sign In Form Illustration -->
  <g transform="translate(760, 110)">
    <!-- Header -->
    <text x="0" y="40" fill="#0f172a" font-family="'Space Grotesk', 'Inter', sans-serif" font-weight="800" font-size="34">Sign in</text>
    <text x="0" y="65" fill="#64748b" font-family="'Inter', sans-serif" font-weight="500" font-size="12">Welcome back to WasteCycle Administrative platform.</text>
    
    <!-- Input Field 1 (E-mail) -->
    <g transform="translate(0, 110)">
      <text x="0" y="0" fill="#475569" font-family="'Inter', sans-serif" font-weight="700" font-size="11">E-mail</text>
      <rect x="0" y="8" width="380" height="44" rx="10" fill="#f1f5f9" />
      <!-- Mail icon symbol -->
      <rect x="15" y="22" width="16" height="12" rx="2" fill="none" stroke="#64748b" stroke-width="1.5" />
      <path d="M15,22 L23,28 L31,22" fill="none" stroke="#64748b" stroke-width="1.5" />
      <text x="42" y="34" fill="#0f172a" font-family="'Inter', sans-serif" font-weight="600" font-size="12">super.admin@dumpsite.org</text>
    </g>

    <!-- Input Field 2 (Password) -->
    <g transform="translate(0, 190)">
      <text x="0" y="0" fill="#475569" font-family="'Inter', sans-serif" font-weight="700" font-size="11">Password</text>
      <text x="380" y="0" fill="#059669" font-family="'Inter', sans-serif" font-weight="800" font-size="11" text-anchor="end">Forgot password?</text>
      <rect x="0" y="8" width="380" height="44" rx="10" fill="#f1f5f9" />
      <!-- Lock icon symbol -->
      <rect x="17" y="24" width="12" height="10" rx="2" fill="none" stroke="#64748b" stroke-width="1.5" />
      <path d="M20,24 L20,21 A3,3 0 0,1 26,21 L26,24" fill="none" stroke="#64748b" stroke-width="1.5" />
      <text x="42" y="34" fill="#0f172a" font-family="'Inter', sans-serif" font-weight="800" font-size="12">••••••••</text>
    </g>

    <!-- Agreement Checkbox -->
    <g transform="translate(0, 275)">
      <rect width="16" height="16" rx="4" fill="#059669" />
      <path d="M4,8 L7,11 L12,5" fill="none" stroke="#ffffff" stroke-width="2" />
      <text x="26" y="12" fill="#475569" font-family="'Inter', sans-serif" font-weight="600" font-size="11">I agree to the security &amp; telemetry terms of service</text>
    </g>

    <!-- Authorize Signature Button -->
    <g transform="translate(0, 315)">
      <rect width="380" height="46" rx="10" fill="#059669" />
      <text x="190" y="27" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="800" font-size="13" text-anchor="middle" letter-spacing="0.5">Authorize Signature  ›</text>
    </g>

    <!-- Fast Pass Presets header -->
    <g transform="translate(0, 395)">
      <line x1="0" y1="0" x2="380" y2="0" stroke="#e2e8f0" stroke-width="1" />
      <rect x="110" y="-8" width="160" height="16" rx="2" fill="#ffffff" />
      <text x="190" y="4" fill="#94a3b8" font-family="'Inter', sans-serif" font-weight="800" font-size="9" text-anchor="middle" letter-spacing="1">FAST-PASS AUTHORIZATION PRESETS</text>
    </g>

    <!-- Fast Pass Presets Buttons -->
    <g transform="translate(0, 415)">
      <!-- Super Admin -->
      <rect x="0" y="0" width="120" height="34" rx="8" fill="#ecfdf5" />
      <text x="60" y="20" fill="#065f46" font-family="'Inter', sans-serif" font-weight="800" font-size="10" text-anchor="middle">Super Admin</text>

      <!-- Ops Office -->
      <rect x="130" y="0" width="120" height="34" rx="8" fill="#eff6ff" />
      <text x="190" y="20" fill="#1e40af" font-family="'Inter', sans-serif" font-weight="800" font-size="10" text-anchor="middle">Ops Office</text>

      <!-- Support Desk -->
      <rect x="260" y="0" width="120" height="34" rx="8" fill="#fffbeb" />
      <text x="320" y="20" fill="#b45309" font-family="'Inter', sans-serif" font-weight="800" font-size="10" text-anchor="middle">Support Desk</text>
    </g>
  </g>

  <!-- Footnote -->
  <g transform="translate(950, 580)">
    <text x="190" y="0" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" font-weight="500" text-anchor="end">🛡️ Symmetric 256-bit SSL encryption. All session handshakes are auditable.</text>
  </g>
</svg>
